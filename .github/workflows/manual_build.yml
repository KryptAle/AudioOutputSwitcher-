name: Generar Mi APK Personalizado
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Dar permisos a Gradle
        run: chmod +x gradlew  # ESTO ES VITAL

      - name: Compilar APK
        run: ./gradlew assembleDebug --stacktrace # Nos dará más info si falla

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk